<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무림기행 - 관리자 패널</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       臾대┝湲고뻾 Admin Panel - Dark Oriental Theme
       ================================================================ */
    :root {
      --bg-darkest: #0a0a0f;
      --bg-dark: #12121a;
      --bg-panel: #1a1a2e;
      --bg-card: #1e1e32;
      --bg-input: #252540;
      --bg-hover: #2a2a4a;
      --border: #333355;
      --border-gold: #8b7536;
      --gold: #d4a843;
      --gold-bright: #f0d060;
      --gold-dim: #8b7536;
      --text: #e0ddd5;
      --text-dim: #8a8890;
      --text-bright: #f5f0e8;
      --accent-red: #c0392b;
      --accent-blue: #2980b9;
      --accent-green: #27ae60;
      --accent-purple: #8e44ad;
      --accent-orange: #e67e22;
      --scrollbar-track: #1a1a2e;
      --scrollbar-thumb: #333355;
      --sidebar-width: 240px;
      --header-height: 56px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-darkest);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444466; }

    /* Header */
    .admin-header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-height);
      background: linear-gradient(135deg, var(--bg-dark) 0%, #16162a 100%);
      border-bottom: 1px solid var(--border-gold);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 100;
    }
    .admin-header .logo {
      font-size: 20px; font-weight: 900; color: var(--gold-bright);
      text-shadow: 0 0 10px rgba(212,168,67,0.3);
      letter-spacing: 2px;
    }
    .admin-header .logo span { font-weight: 300; font-size: 12px; color: var(--text-dim); margin-left: 10px; }
    .admin-header .header-actions { display: flex; gap: 10px; align-items: center; }
    .admin-header .header-actions .version-badge {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 4px; font-size: 11px; color: var(--text-dim);
    }

    /* Sidebar */
    .admin-sidebar {
      position: fixed; top: var(--header-height); left: 0; bottom: 0;
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--bg-dark) 0%, #0e0e18 100%);
      border-right: 1px solid var(--border);
      overflow-y: auto; z-index: 90;
      padding: 12px 0;
    }
    .sidebar-section-label {
      font-size: 10px; color: var(--gold-dim); text-transform: uppercase;
      letter-spacing: 2px; padding: 16px 20px 6px; font-weight: 700;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; cursor: pointer; transition: all 0.2s;
      border-left: 3px solid transparent; font-size: 14px; color: var(--text-dim);
    }
    .sidebar-item:hover { background: var(--bg-hover); color: var(--text); }
    .sidebar-item.active {
      background: var(--bg-panel); color: var(--gold);
      border-left-color: var(--gold);
    }
    .sidebar-item .icon { font-size: 16px; width: 22px; text-align: center; }

    /* Main Content */
    .admin-main {
      position: fixed;
      top: var(--header-height); left: var(--sidebar-width);
      right: 0; bottom: 0;
      overflow-y: auto; padding: 24px;
      background: var(--bg-darkest);
    }

    .section { display: none; }
    .section.active { display: block; }

    /* Section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 {
      font-size: 22px; font-weight: 700; color: var(--gold-bright);
      text-shadow: 0 0 8px rgba(212,168,67,0.15);
    }
    .section-header h2 small { font-size: 12px; color: var(--text-dim); font-weight: 300; margin-left: 8px; }

    /* Buttons */
    .btn {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px;
      font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--gold-dim); color: #fff; border-color: var(--gold); }
    .btn-primary:hover { background: var(--gold); }
    .btn-danger { background: #5c1a1a; color: #ff6b6b; border-color: #8b2020; }
    .btn-danger:hover { background: #7a2020; }
    .btn-secondary { background: var(--bg-card); color: var(--text); }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-success { background: #1a4a2a; color: #6bff9b; border-color: #2a7a3a; }
    .btn-success:hover { background: #2a5a3a; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 6px 8px; font-size: 14px; min-width: 32px; justify-content: center; }

    /* Forms */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 500; color: var(--text-dim);
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px 12px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: inherit; font-size: 13px;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--gold);
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .form-group input[type="checkbox"] { width: auto; margin-right: 6px; }
    .form-group input[type="range"] { padding: 0; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      text-align: left; padding: 10px 12px;
      background: var(--bg-panel); color: var(--gold); font-weight: 500;
      border-bottom: 2px solid var(--border-gold); font-size: 12px;
      position: sticky; top: 0; z-index: 1;
    }
    .data-table td {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .data-table tr:hover td { background: var(--bg-hover); }
    .table-container {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden;
    }
    .table-scroll { max-height: 500px; overflow-y: auto; }

    /* Cards */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px; margin-bottom: 12px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .card-header h3 { font-size: 16px; color: var(--gold); }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .toolbar .search-input {
      padding: 8px 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 13px; min-width: 220px;
      font-family: inherit;
    }
    .toolbar .search-input:focus { outline: none; border-color: var(--gold); }
    .toolbar .filter-select {
      padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 13px; font-family: inherit;
    }

    /* Dashboard */
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px; text-align: center;
      border-top: 3px solid var(--gold-dim);
    }
    .stat-card .stat-value { font-size: 36px; font-weight: 900; color: var(--gold-bright); }
    .stat-card .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); display: flex; align-items: center;
      justify-content: center; z-index: 1000;
    }
    .modal {
      background: var(--bg-panel); border: 1px solid var(--border-gold);
      border-radius: 8px; width: 90%; max-width: 700px; max-height: 85vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg-dark);
    }
    .modal-header h3 { font-size: 16px; color: var(--gold); }
    .modal-body { padding: 20px; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 14px 20px; border-top: 1px solid var(--border); background: var(--bg-dark);
    }

    /* Preview Card */
    .preview-card {
      background: var(--bg-dark); border: 2px solid var(--border);
      border-radius: 8px; padding: 16px; min-width: 220px; max-width: 280px;
    }
    .preview-card .preview-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .preview-card .preview-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
    .preview-card .preview-stats { font-size: 11px; }
    .preview-card .preview-stats div { display: flex; justify-content: space-between; padding: 2px 0; }
    .preview-card .preview-stats .stat-key { color: var(--text-dim); }
    .preview-card .preview-stats .stat-val { color: var(--accent-green); }

    /* Rarity colors */
    .rarity-COMMON { color: #9d9d9d; }
    .rarity-UNCOMMON { color: #1eff00; }
    .rarity-RARE { color: #0070dd; }
    .rarity-EPIC { color: #a335ee; }
    .rarity-LEGENDARY { color: #ff8000; }
    .rarity-MYTHIC { color: #e6cc80; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 16px; }
    .tab {
      padding: 8px 18px; cursor: pointer; font-size: 13px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-bottom: none; border-radius: 4px 4px 0 0; color: var(--text-dim);
      transition: all 0.2s;
    }
    .tab.active { background: var(--bg-panel); color: var(--gold); border-color: var(--border-gold); }
    .tab:hover { color: var(--text); }

    /* Map Editor */
    .map-editor-layout { display: flex; gap: 16px; min-height: 0; height: calc(100vh - 190px); }
    .tile-palette {
      width: 180px; flex-shrink: 0;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px;
    }
    .tile-palette h4 { font-size: 12px; color: var(--gold); margin-bottom: 8px; }
    .tile-swatch {
      display: inline-block; width: 32px; height: 32px; margin: 2px;
      border: 2px solid transparent; cursor: pointer; border-radius: 2px;
      image-rendering: pixelated;
    }
    .tile-swatch.selected { border-color: var(--gold-bright); box-shadow: 0 0 6px var(--gold); }
    .map-canvas-container {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; overflow: auto; position: relative; min-width: 0;
    }
    .map-canvas-container canvas { display: block; cursor: crosshair; image-rendering: pixelated; }

    /* Skill Tree */
    .skill-tree-container {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px; min-height: 200px;
    }
    .skill-tree-container canvas { display: block; }

    /* Badges */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-size: 11px; font-weight: 500;
    }
    .badge-gold { background: rgba(212,168,67,0.15); color: var(--gold); border: 1px solid var(--gold-dim); }
    .badge-blue { background: rgba(41,128,185,0.15); color: #5dade2; border: 1px solid rgba(41,128,185,0.3); }
    .badge-red { background: rgba(192,57,43,0.15); color: #e74c3c; border: 1px solid rgba(192,57,43,0.3); }
    .badge-green { background: rgba(39,174,96,0.15); color: #2ecc71; border: 1px solid rgba(39,174,96,0.3); }
    .badge-purple { background: rgba(142,68,173,0.15); color: #9b59b6; border: 1px solid rgba(142,68,173,0.3); }

    /* Toast */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    .toast {
      background: var(--bg-panel); border: 1px solid var(--border-gold);
      border-radius: 6px; padding: 12px 20px; margin-bottom: 8px;
      font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
    }
    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.error { border-left: 4px solid var(--accent-red); }
    .toast.info { border-left: 4px solid var(--accent-blue); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Dynamic key-value list */
    .kv-list { display: flex; flex-direction: column; gap: 6px; }
    .kv-row { display: flex; gap: 8px; align-items: center; }
    .kv-row select, .kv-row input { flex: 1; padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; font-family: inherit; }
    .kv-row .btn-remove { flex-shrink: 0; }

    /* Drop table */
    .drop-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .drop-row select, .drop-row input { flex: 1; }
    .drop-row .drop-rate { max-width: 80px; text-align: center; }

    /* Quest chain visualization */
    .quest-chain { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .quest-node {
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 12px; font-size: 12px;
    }
    .quest-node.active { border-color: var(--gold); color: var(--gold); }
    .quest-arrow { color: var(--gold-dim); font-size: 18px; }

    /* Toggle switch */
    .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle-track {
      width: 40px; height: 22px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 11px; position: relative; transition: all 0.2s;
    }
    .toggle-track.on { background: var(--gold-dim); border-color: var(--gold); }
    .toggle-thumb {
      width: 18px; height: 18px; background: var(--text); border-radius: 50%;
      position: absolute; top: 1px; left: 1px; transition: all 0.2s;
    }
    .toggle-track.on .toggle-thumb { left: 19px; }
    .toggle-label { font-size: 13px; }

    /* Responsive */
    @media (max-width: 900px) {
      .admin-sidebar { width: 60px; }
      .admin-sidebar .sidebar-item span { display: none; }
      .admin-sidebar .sidebar-section-label { display: none; }
      .admin-main { left: 60px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="admin-header">
    <div class="logo">무림기행<span>관리자 패널</span></div>
    <div class="header-actions">
      <span class="version-badge" id="versionBadge">v0.1.0</span>
      <button class="btn btn-secondary btn-small" onclick="location.href='index.html'">게임으로 돌아가기</button>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="admin-sidebar" id="sidebar">
    <div class="sidebar-section-label">관리</div>
    <div class="sidebar-item active" data-section="dashboard"><span class="icon">DB</span><span>대시보드</span></div>
    <div class="sidebar-item" data-section="items"><span class="icon">IT</span><span>아이템 관리</span></div>
    <div class="sidebar-item" data-section="skills"><span class="icon">SK</span><span>스킬 관리</span></div>
    <div class="sidebar-item" data-section="character"><span class="icon">PC</span><span>메인 캐릭터 관리</span></div>
    <div class="sidebar-item" data-section="monsters"><span class="icon">MO</span><span>몬스터 관리</span></div>
    <div class="sidebar-item" data-section="npcs"><span class="icon">NP</span><span>NPC 관리</span></div>
    <div class="sidebar-item" data-section="maps"><span class="icon">MP</span><span>맵 에디터</span></div>
    <div class="sidebar-item" data-section="sprites"><span class="icon">SP</span><span>스프라이트 관리</span></div>
    <div class="sidebar-item" data-section="quests"><span class="icon">QU</span><span>퀘스트 관리</span></div>
    <div class="sidebar-section-label">시스템</div>
    <div class="sidebar-item" data-section="events"><span class="icon">EV</span><span>이벤트 관리</span></div>
    <div class="sidebar-item" data-section="mounts"><span class="icon">PT</span><span>탈것/환수 관리</span></div>
    <div class="sidebar-item" data-section="stats"><span class="icon">ST</span><span>능력치 설정</span></div>
    <div class="sidebar-item" data-section="settings"><span class="icon">GS</span><span>게임 설정</span></div>
    <div class="sidebar-item" data-section="data"><span class="icon">JS</span><span>데이터 관리</span></div>
  </nav>

  <!-- Main Content -->
  <main class="admin-main" id="mainContent">
    <div class="section active" id="section-dashboard"></div>
    <div class="section" id="section-items"></div>
    <div class="section" id="section-skills"></div>
    <div class="section" id="section-character"></div>
    <div class="section" id="section-monsters"></div>
    <div class="section" id="section-npcs"></div>
    <div class="section" id="section-maps"></div>
    <div class="section" id="section-sprites"></div>
    <div class="section" id="section-quests"></div>
    <div class="section" id="section-events"></div>
    <div class="section" id="section-mounts"></div>
    <div class="section" id="section-stats"></div>
    <div class="section" id="section-settings"></div>
    <div class="section" id="section-data"></div>
  </main>
  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="./src/admin/admin.js"></script>
</body>
</html>
